# =============================================================================
# ReturnGuard · Gitea Release 工作流（仓颉后端 + Vue3 前端 + Rust 启动器）
# 触发：推送 v* tag。行为与 GitHub 版一致：校验 → Rust 核心测试 → 更新日志
#       → 打包（仓颉后端+Vue3 前端+Rust 启动器+SDK）→ Gitea API 发布并上传附件。
#
# 说明：
# 1. Gitea Actions 与 GitHub Actions 语法兼容；本文件复用 actions/* 动作。
#    Runner 无法访问 github.com 时，把 DEFAULT_ACTIONS_URL 设为 self 并镜像动作。
# 2. Runner 标签需匹配 runs-on（ubuntu-latest）；不匹配时改为实际标签。
# 3. 发布用内置令牌 secrets.GITEA_TOKEN（需 contents: write）。旧实例若只认
#    `Authorization: token` 头，替换即可。
# 4. JSON 转义统一用 Node（act_runner 的 node 镜像自带）。
# =============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      GITEA_API: ${{ github.server_url }}/api/v1
      GITEA_REPO: ${{ github.repository }}
    steps:
      - name: Checkout（含全部 tag）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tag version matches VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "tag=${TAG_VERSION}  VERSION=${FILE_VERSION}"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag v${TAG_VERSION} 与 VERSION ${FILE_VERSION} 不一致"
            exit 1
          fi

      - name: Test Rust launcher core
        run: |
          rm -f launcher/.cargo/config.toml   # CI 直连 crates.io
          cd launcher && cargo test -p rg-core

      - name: Determine version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "# ReturnGuard ${TAG#v}"
            echo
            echo "Release \`${TAG}\` — $(date +%F)"
            echo
            if [ -n "$PREV" ]; then
              echo "## Changes since \`${PREV}\`"; echo
              git log "${PREV}..${TAG}" --pretty=format:"- %s (%h)"
            else
              echo "## Changes"; echo
              git log --pretty=format:"- %s (%h)"
            fi
          } > CHANGELOG_GEN.md

      - name: Package release artifact
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          tar -czf "dist/returnguard-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='node_modules' --exclude='__pycache__' --exclude='target' \
            --exclude='backend/build' --exclude='backend/build-linux' \
            --exclude='backend/probe' --exclude='backend/probe_db' --exclude='backend/data' \
            --exclude='web/dist' --exclude='*.db' --exclude='Dataset' --exclude='.env' \
            --exclude='*.whl' \
            backend web sdk demo docker scripts launcher \
            LICENSE NOTICE README.md CHANGELOG.md VERSION package.json \
            docs "openGauss部署指南.md"
          ( cd dist && sha256sum "returnguard-${VERSION}.tar.gz" > "returnguard-${VERSION}.sha256" )
          echo "tarball size: $(du -h dist/returnguard-${VERSION}.tar.gz | cut -f1)"

      - name: Create Gitea Release and upload assets
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # 用 Node 安全转义多行 changelog（act_runner 镜像自带 node，无需 python/jq）
          node - <<'JS'
          const fs = require('fs');
          const data = {
            tag_name: process.env.GITHUB_REF_NAME,
            name: 'ReturnGuard ' + process.env.VERSION,
            body: fs.readFileSync('CHANGELOG_GEN.md', 'utf8'),
            target_commitish: process.env.GITHUB_SHA,
          };
          fs.writeFileSync('release.json', JSON.stringify(data));
          JS

          RELEASE_ID=$(curl -sS -X POST \
            "$GITEA_API/repos/$GITEA_REPO/releases" \
            -H "Authorization: Bearer $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            --data @release.json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).id||"")}catch(e){console.log("")}})')

          echo "Created release $TAG -> id=$RELEASE_ID"
          test -n "$RELEASE_ID" || { echo "::error::Gitea 未返回 release id"; exit 1; }

          for f in "dist/returnguard-${VERSION}.tar.gz" "dist/returnguard-${VERSION}.sha256"; do
            curl -sS -X POST \
              "$GITEA_API/repos/$GITEA_REPO/releases/$RELEASE_ID/assets?name=$(basename "$f")" \
              -H "Authorization: Bearer $GITEA_TOKEN" \
              -F "attachment=@$f"
            echo " -> uploaded $(basename "$f")"
          done
