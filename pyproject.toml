# ============================================================
# ReturnGuard · 工程化配置（lint / format / type / test）
# 仅作为本地与 CI 的质量门禁，不参与运行时依赖。
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes（基础错误/未使用）；I: import 排序；
# W: 警告；UP: pyupgrade；B: bugbear（常见坑）
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # 长行交给 black 处理

# FastAPI 在依赖函数默认参数里写 File()/Form() 是惯用法（B008 误报），对此文件豁免
[tool.ruff.lint.per-file-ignores]
"demo/main.py" = ["B008"]
"demo/routers/*.py" = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
# 第三方库（fastapi/sqlalchemy/numpy 等）类型 stub 可能与本地 Python 版本不一致，
# 直接 skip 其 stub 解析（按 Any 处理），只对我们自己的代码做类型检查，避免误报阻断 CI。
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = false
show_error_codes = true
disallow_untyped_defs = false
# 增量策略：先看紧「已标注类型」的代码（check_untyped_defs=false 不深查无标注函数体），
# 让 mypy 作为 CI 门禁先落地、不阻断现有绿灯；后续为函数补注解后逐步收紧。
check_untyped_defs = false
# 第三方库（reportlab / openpyxl 等）已安装但缺类型 stub，导入报 import-untyped；
# 项目不依赖其类型，统一降级为「按 Any 处理」，避免阻断 CI（P2-12 门禁聚焦自有代码）。
disable_error_code = ["import-untyped"]
# 仅类型检查「核心应用」模块。以下为一次性/数据/录屏辅助脚本（非运行时依赖），不纳入门禁。
# 注意：CI 在 demo/ 目录以 `mypy .` 运行，路径相对 demo/，故此处用文件名（而非 demo.xxx）匹配。
exclude = [
  "seed_real\\.py",
  "convert_datasets\\.py",
  "build_c_listing\\.py",
  "pdf_report\\.py",
  "capture_live_demo\\.py",
  "dataset_parse\\.py",
  "verify_.*\\.py",
  "test_.*\\.py",
  "tests/.*",
]

[tool.pytest.ini_options]
# 项目代码在 demo/ 下，conftest/测试从根目录（本地与 CI 一致）运行时必须把它加入 sys.path，
# 否则 import shared_state / import main 会 ModuleNotFoundError（即原 CI 崩的根因）。
pythonpath = ["demo"]
testpaths = ["demo/tests"]

# ===================== 覆盖率门禁（P1-11）=====================
# 本段为「覆盖率门禁」配置，仅在运行 `pytest --cov` 时生效（需安装 pytest-cov）。
# CI / 本地质量门禁执行 `bash demo/tests/run_with_coverage.sh`：
#   低于 fail_under 阈值直接非零退出，阻断合并/部署，强制补测试。
[tool.coverage.run]
branch = true
parallel = false
# 隔离数据文件名，避免与沙箱/编辑器注入的 .coverage*（statement-only）在合并阶段冲突报
# "Can't combine statement coverage data with branch data"（仅本地沙箱环境会触发，CI 无此问题）。
data_file = ".coverage.rg"
source = ["demo"]
omit = [
    # 本地从仓库根运行（--cov=demo）时的路径
    "demo/tests/*",
    "demo/test_*.py",
    "demo/verify_*.py",
    "demo/convert_datasets.py",
    "demo/generate_dataset.py",
    "demo/dataset_parse.py",
    "demo/seed_real.py",
    # 纯开发/一次性脚本（非部署运行时代码，不参与覆盖率门禁）
    "demo/build_c_listing.py",
    "demo/capture_live_demo.py",
    "demo/compare_models.py",
    "demo/generate_platform_doc.py",
    # CI 在 demo/ 目录运行（--cov=.）时的路径
    "tests/*",
    "test_*.py",
    "verify_*.py",
    "convert_datasets.py",
    "generate_dataset.py",
    "dataset_parse.py",
    "seed_real.py",
    "build_c_listing.py",
    "capture_live_demo.py",
    "compare_models.py",
    "generate_platform_doc.py",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = false
