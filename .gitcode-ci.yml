# =============================================================================
# ReturnGuard · GitCode Release 流水线
# 触发：推送形如 v* 的 Git tag（如 v2.1.2）
# 行为：
#   build_test_package：检出 → 配环境(Python+Node) → 构建(压缩前端) → 测试
#                       → 从 tag 取版本号 → 生成更新日志 → 打包 tarball+sha256
#   release           ：用 glab 把更新日志与构建产物作为附件发布到 GitCode Release
# 与 .github/workflows/release.yml、.gitea/workflows/release.yml 行为一致。
#
# 说明：
# 1. 配置文件名默认 .gitcode-ci.yml；旧 CODECHINA 实例可能仍用 .codechina-ci.yml，
#    可在「设置 → DevOps → 流水线通用 → CI/CD 配置文件」里改路径或改名。
# 2. release 作业使用 registry.gitlab.com/gitlab-org/cli:latest（glab CLI）镜像。
#    若 Runner 无法拉取该镜像，请替换为 GitCode 镜像或预装 glab 的镜像。
# 3. glab 通过 GLAB_ENABLE_CI_AUTOLOGIN=true 复用 CI_JOB_TOKEN 鉴权，无需额外 PAT；
#    --notes-file 直接采用生成的更新日志文件，位置参数即作为 Release 附件上传。
# =============================================================================
stages:
  - build
  - release

build_test_package:
  stage: build
  image: python:3.11-slim
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends nodejs npm git jq
  script:
    - python -m pip install --upgrade pip
    - pip install -r demo/requirements.txt -r demo/requirements-dev.txt
    - npm install
    - node scripts/minify.mjs
    - pytest demo/tests -p no:cacheprovider -q
    # 取版本号 + 生成更新日志（上一 tag 到当前 tag 的提交；无上一 tag 则用全量）
    - |
      git fetch --tags --quiet 2>/dev/null || true
      TAG="$CI_COMMIT_TAG"
      VERSION="${TAG#v}"
      PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
      {
        echo "# ReturnGuard ${VERSION}"
        echo
        echo "Release \`${TAG}\` — $(date +%F)"
        echo
        if [ -n "$PREV" ]; then
          echo "## Changes since \`${PREV}\`"
          echo
          git log "${PREV}..${TAG}" --pretty=format:"- %s (%h)"
        else
          echo "## Changes"
          echo
          git log --pretty=format:"- %s (%h)"
        fi
      } > CHANGELOG_GEN.md
    # 打包分发物（同步 VERSION 文件，排除仓库噪音与大体积/密钥文件）
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "$VERSION" > VERSION
      mkdir -p dist
      tar -czf "dist/returnguard-${VERSION}.tar.gz" \
        --exclude='.git' \
        --exclude='docker/wheels/*.whl' --exclude='*.whl' \
        --exclude='node_modules' --exclude='__pycache__' \
        --exclude='*.db' --exclude='Dataset' --exclude='.env' \
        demo docker scripts LICENSE NOTICE README.md CHANGELOG.md \
        VERSION package.json pyproject.toml docs "openGauss部署指南.md"
      ( cd dist && sha256sum "returnguard-${VERSION}.tar.gz" > "returnguard-${VERSION}.sha256" )
  artifacts:
    paths:
      - dist/
      - CHANGELOG_GEN.md
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs:
    - job: build_test_package
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - glab release create "$CI_COMMIT_TAG" --notes-file CHANGELOG_GEN.md --ref "$CI_COMMIT_SHA" "dist/returnguard-${VERSION}.tar.gz#ReturnGuard ${VERSION} (tar.gz)" "dist/returnguard-${VERSION}.sha256#SHA256 校验和"
