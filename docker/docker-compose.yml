# ============================================================
# ReturnGuard · 容器编排（openGauss 基于 openEuler 基底容器，docker compose up -d）
# 两个服务：
#   db  —— openGauss 5.0.0（华为开源国产库，兼容 PostgreSQL 协议；
#          使用社区维护更稳定的 enmotech/opengauss:5.0.0）
#   app —— ReturnGuard FastAPI 应用（docker/ 目录下 Dockerfile 构建，源码在 demo/）
# 开发与部署统一 openGauss：app 的 DATABASE_URL 默认指向 db 服务，业务代码零改动。
# 部署配置与源码解耦：本文件位于仓库 docker/，build context 为仓库根（..）。
# ============================================================
name: returnguard

services:
  # ---------- 国产数据库 openGauss ----------
  db:
    # 说明：
    # - opengauss/opengauss 官方仓库在 Docker Hub 上无 6.0.x 稳定 tag；
    # - 7.0.0-RC3 预览版镜像存在缺库(libopenblas.so.0)bug，容器无法启动；
    # - opengauss/opengauss:5.0.0 在 Docker Desktop(WSL2) 下偶发 cgroup/内存不稳；
    # - enmotech/opengauss:5.0.0 为国内社区最常用的稳定镜像，与官方协议/参数兼容。
    image: enmotech/opengauss:5.0.0
    container_name: rg_opengauss
    privileged: true            # openGauss 需调整内核参数，必须提权
    environment:
      # SEC-13：口令必须由 docker/.env 显式提供，**不再内置默认值**（此前缺省为
      # 公开示例口令 Gauss-2026，任何人照搬仓库即可登录数据库）。缺失时 compose 直接
      # 报错中止，避免"以为配了其实用了默认口令"。口令仍不含 @/# 等 URL 保留字符。
      GS_PASSWORD: ${GS_PASSWORD:?GS_PASSWORD 必须在 docker/.env 中显式设置}
      GS_USERNAME: gaussdb       # 业务连接用户（默认即 gaussdb）
      GS_DB: returnguard         # 初始化时自动创建的库
      GS_PORT: 5432
      TZ: Asia/Shanghai
    ports:
      # SEC-13：数据库**仅监听本机回环**。此前 "5432:5432" 等价 0.0.0.0:5432，
      # 数据库端口直接暴露到局域网/公网（实测 docker ps 显示 0.0.0.0:5432->5432），
      # 叠加示例口令即可被直连。应用经 compose 内网 db:5432 访问，不受影响；
      # 运维需本地直连时用 127.0.0.1:5432 或进容器执行。
      - "127.0.0.1:5432:5432"
    volumes:
      - ogdata:/var/lib/opengauss   # 数据持久化，容器重建不丢数据
    shm_size: 2gb            # openGauss/PostgreSQL 类数据库需要足够共享内存；WSL2 建议 ≥2GB
    # 重要：Docker Desktop WSL2 请确保内存 ≥4GB（Settings → Resources → Memory）
    healthcheck:
      # /dev/tcp 与 gsql 在该镜像初始化阶段均不够稳，改用进程探测：
      # gaussdb 主进程存在即认为数据库已启动（应用 entrypoint 会再做 TCP 端口确认）。
      test: ["CMD-SHELL", "pgrep -x gaussdb > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30            # 首次初始化可能较慢，给足 5min 缓冲
      start_period: 180s
    restart: unless-stopped

  # ---------- ReturnGuard 应用 ----------
  app:
    build:
      context: ..            # 仓库根（含 demo/ 源码与 docker/ 部署配置）
      dockerfile: docker/Dockerfile
      # 构建期 pip 源（默认官方 PyPI，行为不变）。国内网络直连常下载中断，
      # 在 docker/.env 设 PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple 即可提速。
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: returnguard-app:latest
    container_name: rg_app
    depends_on:
      db:
        condition: service_healthy   # 等 openGauss 真正可连再起应用
      realdb-init:
        condition: service_completed_successfully   # 等 returnguard_real 库建好再起应用
    environment:
      # 统一 openGauss（postgresql+psycopg2 方言，协议兼容；开发与部署同一套）
      # 密码里不含 @/#，可直接写明文；若后续改含保留字符的密码，需 URL 编码。
      DATABASE_URL: postgresql+psycopg2://gaussdb:${GS_PASSWORD}@db:5432/returnguard
      AUTH_DATABASE_URL: postgresql+psycopg2://gaussdb:${GS_PASSWORD}@db:5432/returnguard
      # P0 物理隔离：real 源使用独立库 returnguard_real（由 realdb-init 一次性服务创建），
      # 与 demo 源（returnguard）分库，杜绝「写入 real 却污染 demo 看板」的部署态缺陷。
      REAL_DATABASE_URL: ${REAL_DATABASE_URL:-postgresql+psycopg2://gaussdb:${GS_PASSWORD}@db:5432/returnguard_real}
      # AI 网关（live 模式）：密钥/端点一律从宿主 .env（仓库根，已 gitignore）注入，
      # 防止密钥误提交公网仓库。profile 缺省 tokenplan；切 dashscope（视觉全开）改宿主 .env 即可。
      MODEL_ROUTER_PROFILE: ${MODEL_ROUTER_PROFILE:-tokenplan}
      MODEL_ROUTER_API_KEY: ${MODEL_ROUTER_API_KEY:-}
      MODEL_ROUTER_BASE_URL: ${MODEL_ROUTER_BASE_URL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-}
      PUBLIC_IMAGE_BASE: ${PUBLIC_IMAGE_BASE:-}
      # ---- 上传图存储：本机自持（默认），可选自托管隧道回源 ----
      # 退货图一律落本机 demo/uploads/；视觉调用默认走 base64 内联本地文件，
      # 故留空即可纯本地运行。仅当希望 live 视觉由服务端回源拉图时，
      # 再配 RG_SELF_IMAGE_BASE=https://<隧道域名>/api/img。
      RG_SELF_IMAGE_BASE: ${RG_SELF_IMAGE_BASE:-}
      UPLOAD_URL_TTL: ${UPLOAD_URL_TTL:-3600}
      # ---- 安全加固必配项 ----
      # 此前仅有文档指引而 compose 未透传，容器内这些变量全为空并静默降级：
      # 公开账号可改写全局阈值、令牌重启即失效、限流坍缩成单桶。现统一透传。
      # AUTH_SECRET：令牌 HMAC 签名密钥，不设则重启后所有令牌失效（应用会打 CRITICAL）。
      #   生成：python -c "import secrets;print(secrets.token_hex(32))"
      AUTH_SECRET: ${AUTH_SECRET:-}
      # ADMIN_API_KEY：/api/calibrate、/metrics 管理动作密钥；不设则退化为"已登录即可"，
      #   而公网体验账号 demo/demo123 是公开的，等同任何人都能改判定阈值。
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # 公网演示默认关闭开放注册；如需开放再配 REGISTRATION_INVITE_CODE 走邀请制。
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}
      # 经反向代理 / CDN 部署时直连 IP 恒为 127.0.0.1，须设为 127.0.0.1 才能还原真实
      # 访客 IP，否则限流 / 防爆破会坍缩成全局单桶。
      AUTH_TRUSTED_PROXIES: ${AUTH_TRUSTED_PROXIES:-127.0.0.1}
      LOGIN_MAX_FAILS: ${LOGIN_MAX_FAILS:-5}
      LOGIN_LOCK_MIN: ${LOGIN_LOCK_MIN:-15}
      # ---- SEC-13 live 模式独立配额闸（0 = 关闭该层）----
      # 公网演示账号 demo/demo123 是已对外发布的公开凭据，live 链路真实消耗服务端
      # 付费 Key；通用限流（60 次/分钟）挡不住"低频持续"刷量，故按天另设闸门：
      # 全局日配额是账单兜底线，账号日配额管单账号，IP 小时配额抑制突发。
      LIVE_QUOTA_GLOBAL_DAY: ${LIVE_QUOTA_GLOBAL_DAY:-300}
      LIVE_QUOTA_TENANT_DAY: ${LIVE_QUOTA_TENANT_DAY:-60}
      LIVE_QUOTA_IP_HOUR: ${LIVE_QUOTA_IP_HOUR:-20}
      # 公网跨域白名单（逗号分隔具体域名，禁止 *）；留空 = 不挂 CORS
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      # P1-C 透传：写接口的演示种子重置开关（FORCE_RESEED=1 仅重置 demo，real 不动）。
      # 此前 compose 未暴露该变量导致宿主 env 无法传入容器，重建只能进容器手动 init_db。
      FORCE_RESEED: ${FORCE_RESEED:-}
      # 跨 worker 共享状态（限流/登录锁/KV）刻意保留在 SQLite（rg_state.db）默认值：
      # shared_state 的限流计数用 ON CONFLICT...DO UPDATE upsert，openGauss 不支持该 PG 9.5+
      # 语法（实测 Upsert 解析报错），而 SQLite 原生支持；单容器部署多 worker 共享同一文件即一致。
      # 多主机部署才需改为 Redis/PG 后端（届时 shared_state 须重写 upsert 分支）。
      # 故此处不指向 openGauss，而是把该 SQLite 库落到**持久化卷** rg_state（见下方 volumes），
      # 避免容器重建导致计数清零、配额闸被绕过。（SQLite 绝对路径需 4 个斜杠）
      STATE_DB_URL: ${STATE_DB_URL:-sqlite:////app/demo/state/rg_state.db}
    ports:
      # 本地测试：仅绑定宿主机回环，避免把应用直接暴露到局域网
      - "127.0.0.1:65432:8000"
    # 安全加固（B-部署·防污染）：禁止容器提权，避免漏洞被利用做特权升级；
    # 不挂载宿主机源码/数据目录（无 bind-mount），镜像与宿主机相互隔离，运行期写仅落 volumes。
    security_opt:
      - no-new-privileges:true
    # 应用健康检查：探测 /health 探针（python 内置 urllib，无需额外装 curl）
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # 上传图持久化（去云端化后退货图落本机 demo/uploads/）：挂 named volume，
    # 容器重建/升级不丢图；named volume 而非 bind-mount，维持与宿主机隔离的加固基调。
    volumes:
      - rg_uploads:/app/demo/uploads
      # SEC-13：限流 / 登录封禁 / **live 配额**的计数库必须持久化。此前 rg_state.db
      # 落在容器可写层，容器一重建计数即清零 —— "按天配额"实际退化成"按容器生命周期"，
      # 重建一次就能绕开闸门。改挂 named volume，并在镜像内预建目录（Dockerfile 的
      # mkdir demo/state），保证空卷首次挂载时属主为 appuser、可写。
      - rg_state:/app/demo/state

  # ---------- real 源独立库一次性初始化（P0 物理隔离）----------
  # demo 源用 returnguard 库；real 源用独立 returnguard_real 库（见上方 REAL_DATABASE_URL），
  # 二者分库，写入 real 不再污染 demo 看板。首次 docker compose up 自动建库（幂等：库已存在则直接退出）。
  realdb-init:
    image: enmotech/opengauss:5.0.0
    container_name: rg_realdb_init
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 同 db 服务：口令由 .env 显式提供，不内置默认值
      GS_PASSWORD: ${GS_PASSWORD:?GS_PASSWORD 必须在 docker/.env 中显式设置}
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        export GAUSSHOME=/usr/local/opengauss
        export LD_LIBRARY_PATH=/usr/local/opengauss/lib:/usr/local/opengauss/lib64:$$LD_LIBRARY_PATH
        for i in $$(seq 1 30); do
          if /usr/local/opengauss/bin/gsql -h db -U gaussdb -W "$$GS_PASSWORD" -d postgres \
              -c "SELECT 1 FROM pg_database WHERE datname='returnguard_real';" 2>/dev/null | grep -q returnguard_real; then
            echo "[realdb-init] returnguard_real 已存在，跳过"; exit 0
          fi
          echo "[realdb-init] 第 $$i 次尝试创建 returnguard_real ..."
          if /usr/local/opengauss/bin/gsql -h db -U gaussdb -W "$$GS_PASSWORD" -d postgres \
              -c "CREATE DATABASE returnguard_real;"; then
            echo "[realdb-init] 已创建 returnguard_real"; exit 0
          fi
          sleep 3
        done
        echo "[realdb-init] 创建 returnguard_real 失败"; exit 1

volumes:
  ogdata:
  rg_uploads:
  rg_state:
