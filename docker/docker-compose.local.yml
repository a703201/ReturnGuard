# ============================================================
# ⚠️ 已弃用（DEPRECATED）：开发现已统一使用 openGauss（见 docker-compose.yml 的 db 服务），本 SQLite 本地版仅作离线回退，勿用于开发 / 演示（会与 openGauss 部署口径不一致、掩盖部署问题）
# ------------------------------------------------------------
# 用法：
#   cd returnguard
#   docker compose -f docker/docker-compose.local.yml up -d --build
#   浏览器打开 http://localhost:8000
#
# 停止：docker compose -f docker/docker-compose.local.yml down
#
# 与 docker-compose.yml（openGauss 统一开发&部署）的区别：
#   - 无 openGauss 容器（省内存、省初始化时间）
#   - 使用 SQLite（离线回退用，与 openGauss 部署口径不一致）
#   - ⚠️ 仅限无 openGauss 的离线环境；日常开发与演示请用 openGauss 版（先 `up db` 再 `up app`）
#
# 开发期热更新（关键）：
#   - 通过 `../demo:/app` 把主机源码绑定挂载进容器，改文件即时生效，无需重建镜像
#   - uvicorn 加 --reload，.py 改动自动重载（.html 等静态文件按请求读盘，刷新即见）
#   - 覆盖 Dockerfile 的 ENTRYPOINT（默认 entrypoint.sh 会等待不存在的 db:5432，
#     本地版无数据库容器，必须跳过该等待，否则启动要干等 ~120s）
#   - SQLite 库文件落在挂载的 /app（= 主机 demo/），天然持久化，且已被 .gitignore 忽略
# ============================================================
name: returnguard-local

services:
  app:
    build:
      context: ..            # 仓库根
      dockerfile: docker/Dockerfile
    image: returnguard-app:local
    container_name: rg_app_local
    # 覆盖 Dockerfile 的 ENTRYPOINT（entrypoint.sh 会等待 db:5432，本地版无该服务），
    # 改为直接执行下方 command（轻量、不等待外部数据库）。
    entrypoint: ["sh", "-c"]
    environment:
      # SQLite 模式（默认值，显式声明以防覆盖）
      # Docker 绑挂载（Windows/macOS）下 WAL 的 -shm/mmap 在挂载点会 disk I/O error，
      # 故容器化本地部署关闭 WAL（改用 DELETE 日志模式）；宿主机原生 fs 不受影响。
      SQLITE_NO_WAL: "1"
      DATABASE_URL: sqlite:///./cases.db
      REAL_DATABASE_URL: sqlite:///./cases_real.db
      AUTH_DATABASE_URL: sqlite:///./users.db
      # 演示态：不需要 API Key、不需要模型网关
      ANALYZE_API_KEY: ""
      ANALYZE_RATE_LIMIT: "60"
      # 安全加固默认值（演示态宽松，生产收紧）
      # 公网体验地址关闭开放注册，评委用内置 demo/demo123；需要自注册时改 true 并建议配 REGISTRATION_INVITE_CODE
      REGISTRATION_ENABLED: "false"
      AUTH_REGISTER_LIMIT: "10"
      AUTH_LOGIN_IP_LIMIT: "30"
      LOGIN_MAX_FAILS: "5"
      LOGIN_LOCK_MIN: "15"
      # 经 Cloudflare Tunnel / 反代部署时须设 127.0.0.1，否则按 IP 限流/防爆破会坍缩成全局单桶（SEC-3）
      AUTH_TRUSTED_PROXIES: "127.0.0.1"
    ports:
      # 对齐 Cloudflare 隧道（deploy/rg-tunnel.yml → localhost:65432）；仅绑 localhost，
      # 由本机 cloudflared 反代出公网，不直接暴露给外部网络。
      - "127.0.0.1:65432:8000"
    # 开发期绑定挂载源码：改动即时生效，免重建镜像
    volumes:
      - ../demo:/app
    working_dir: /app
    # 直接初始化（demo+real 双源）并启动 uvicorn；--reload 让 .py 改动自动重载
    command:
      - 'mkdir -p uploads && python -c "from auth import init_auth_db; from db import init_db; init_db(''demo''); init_db(''real'')" && uvicorn main:app --host 0.0.0.0 --port 8000 --reload'
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
