# ============================================================
# ReturnGuard · 容器编排（openGauss 基于 openEuler 基底容器，docker compose up -d）
# 两个服务：
#   db  —— openGauss 5.0.0（华为开源国产库，兼容 PostgreSQL 协议；
#          Docker Hub 稳定 LTS tag，支持 GS_USERNAME/GS_DB 初始化）
#   app —— ReturnGuard FastAPI 应用（本目录 Dockerfile 构建）
# 双轨切换：app 的 DATABASE_URL 指向 db 服务即可，业务代码零改动。
# ============================================================
name: returnguard

services:
  # ---------- 国产数据库 openGauss ----------
  db:
    # Docker Hub 上 opengauss/opengauss 仓库无 6.0.x 稳定 tag；
    # 7.0.0-RC3 预览版镜像存在缺库(libopenblas.so.0)bug，容器无法启动。
    # 5.0.0 为官方 LTS 稳定版，同样支持 GS_USERNAME/GS_DB，本地/初赛验证首选。
    # 生产如需 6.x 稳定版请走华为云 SWR 或 OBS tar 包。
    image: opengauss/opengauss:5.0.0
    container_name: rg_opengauss
    privileged: true            # openGauss 需调整内核参数，必须提权
    environment:
      GS_PASSWORD: ${GS_PASSWORD:-Gauss@2026}   # 必填：omm 与 gaussdb 用户密码
      GS_USERNAME: gaussdb       # 业务连接用户（默认即 gaussdb）
      GS_DB: returnguard         # 初始化时自动创建的库
      GS_PORT: 5432
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"              # 对外暴露，便于运维/本地直连（生产可仅留内网）
    volumes:
      - ogdata:/var/lib/opengauss   # 数据持久化，容器重建不丢数据
    shm_size: 1gb            # openGauss/PostgreSQL 类数据库需要足够共享内存
    healthcheck:
      # openGauss 镜像基于 openEuler，自带 bash；用 /dev/tcp 探测 5432 是否真在监听
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/tcp/127.0.0.1/5432'"]
      interval: 10s
      timeout: 5s
      retries: 18            # 首次初始化可能较慢，给足 3min 缓冲
      start_period: 120s
    restart: unless-stopped

  # ---------- ReturnGuard 应用 ----------
  app:
    build: .
    container_name: rg_app
    depends_on:
      db:
        condition: service_healthy   # 等 openGauss 真正可连再起应用
    environment:
      # 双轨切换核心：部署期用 openGauss（postgresql+psycopg2 方言，协议兼容）
      DATABASE_URL: postgresql+psycopg2://gaussdb:${GS_PASSWORD:-Gauss@2026}@db:5432/returnguard
      MODEL_ROUTER_API_KEY: ${MODEL_ROUTER_API_KEY:-}
      MODEL_ROUTER_BASE_URL: ${MODEL_ROUTER_BASE_URL:-}
      PUBLIC_IMAGE_BASE: ${PUBLIC_IMAGE_BASE:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  ogdata:
