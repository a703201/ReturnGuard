# ============================================================
# ReturnGuard · 容器编排（openEuler 主机上 docker compose up -d）
# 两个服务：
#   db  —— openGauss 7.0.0-RC3（华为开源国产库，兼容 PostgreSQL 协议；
#          Docker Hub 无 6.0.x tag，故用当前可拉的 7.0.0-RC3.B025）
#   app —— ReturnGuard FastAPI 应用（本目录 Dockerfile 构建）
# 双轨切换：app 的 DATABASE_URL 指向 db 服务即可，业务代码零改动。
# ============================================================
name: returnguard

services:
  # ---------- 国产数据库 openGauss ----------
  db:
    # Docker Hub 上 opengauss/opengauss 仓库无 6.0.x 稳定 tag；
    # 7.0.0-RC3.B025 是当前官方维护、支持 GS_USERNAME/GS_DB 的可用版本，
    # 与 6.x 初始化参数兼容，可直接替换。生产如需 6.x 稳定版请走华为云 SWR 或 OBS tar。
    image: opengauss/opengauss:7.0.0-RC3.B025
    container_name: rg_opengauss
    privileged: true            # openGauss 需调整内核参数，必须提权
    environment:
      GS_PASSWORD: ${GS_PASSWORD:-Gauss@2026}   # 必填：omm 与 gaussdb 用户密码
      GS_USERNAME: gaussdb       # 业务连接用户（默认即 gaussdb）
      GS_DB: returnguard         # 初始化时自动创建的库
      GS_PORT: 5432
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"              # 对外暴露，便于运维/本地直连（生产可仅留内网）
    volumes:
      - ogdata:/var/lib/opengauss   # 数据持久化，容器重建不丢数据
    healthcheck:
      # openGauss 镜像基于 openEuler，自带 bash，可用 /dev/tcp 探活
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/5432'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # ---------- ReturnGuard 应用 ----------
  app:
    build: .
    container_name: rg_app
    depends_on:
      db:
        condition: service_healthy   # 等 openGauss 真正可连再起应用
    environment:
      # 双轨切换核心：部署期用 openGauss（postgresql+psycopg2 方言，协议兼容）
      DATABASE_URL: postgresql+psycopg2://gaussdb:${GS_PASSWORD:-Gauss@2026}@db:5432/returnguard
      MODEL_ROUTER_API_KEY: ${MODEL_ROUTER_API_KEY:-}
      MODEL_ROUTER_BASE_URL: ${MODEL_ROUTER_BASE_URL:-}
      PUBLIC_IMAGE_BASE: ${PUBLIC_IMAGE_BASE:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  ogdata:
