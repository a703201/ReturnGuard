# =============================================================================
# ReturnGuard · GitHub Release 工作流（仓颉后端 + Vue3 前端 + Rust 启动器）
# 触发：推送形如 v* 的 Git tag
# 行为：检出 → 校验版本 → 核心引擎测试 → 生成更新日志 → 打包 tarball+sha256 → 发布
# 与 .gitea/workflows/release.yml、.gitcode/workflows/release.yml 行为一致。
# =============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（含全部 tag，供生成更新日志）
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag version matches VERSION（不一致则拒绝发布）
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "tag=${TAG_VERSION}  VERSION=${FILE_VERSION}"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag v${TAG_VERSION} 与仓库 VERSION ${FILE_VERSION} 不一致；请先同步 VERSION/package.json/CHANGELOG 再打 tag"
            exit 1
          fi

      - name: Test Rust launcher core
        run: |
          rm -f launcher/.cargo/config.toml   # CI 直连 crates.io
          cd launcher && cargo test -p rg-core

      - name: Determine version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "# ReturnGuard ${TAG#v}"
            echo
            echo "Release \`${TAG}\` — $(date +%F)"
            echo
            if [ -n "$PREV" ]; then
              echo "## Changes since \`${PREV}\`"
              echo
              git log "${PREV}..${TAG}" --pretty=format:"- %s (%h)"
            else
              echo "## Changes"
              echo
              git log --pretty=format:"- %s (%h)"
            fi
          } > CHANGELOG_GEN.md

      - name: Package release artifact（仓颉后端 + Vue3 前端 + Rust 启动器 + SDK）
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          tar -czf "dist/returnguard-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='node_modules' --exclude='__pycache__' --exclude='target' \
            --exclude='backend/build' --exclude='backend/build-linux' \
            --exclude='backend/probe' --exclude='backend/probe_db' --exclude='backend/data' \
            --exclude='web/dist' --exclude='*.db' --exclude='Dataset' --exclude='.env' \
            --exclude='*.whl' \
            backend web sdk demo docker scripts launcher \
            LICENSE NOTICE README.md CHANGELOG.md VERSION package.json \
            docs "openGauss部署指南.md"
          ( cd dist && sha256sum "returnguard-${VERSION}.tar.gz" > "returnguard-${VERSION}.sha256" )
          echo "tarball size: $(du -h dist/returnguard-${VERSION}.tar.gz | cut -f1)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ReturnGuard ${{ steps.ver.outputs.version }}
          body_path: CHANGELOG_GEN.md
          files: |
            dist/returnguard-${{ steps.ver.outputs.version }}.tar.gz
            dist/returnguard-${{ steps.ver.outputs.version }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
