name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    # B-测试：Python 版本矩阵（当前 3.11 / 3.12 双版本验证复现性；新增版本在此追加即可）
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: demo/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      # B-测试：mypy 类型检查（增量门禁）。
      # 当前 check_untyped_defs=false，仅对「已标注类型」的代码做校验，避免无注解存量代码阻断流水线；
      # 后续为函数补全注解后逐步收紧。
      # P2-12：由「不阻断」升级为阻断门禁（去掉 continue-on-error），类型错误直接失败，提供强约束。
      - name: Mypy type check
        run: mypy demo

      # P2-12：安全扫描（SAST + 依赖 CVE）。
      # - bandit：源码静态安全审计，仅报高危（severity high, -lll），并对 tests 目录豁免；
      #   初期以「可见性优先」运行（continue-on-error），待基线稳定后可去掉该标志转为阻断。
      # - pip-audit：检查依赖树已知 CVE，同样先以可见性优先运行，基线稳定后转阻断。
      - name: Bandit SAST (high severity)
        run: |
          pip install bandit
          bandit -r demo -lll -x demo/tests -q
        continue-on-error: true

      - name: Dependency CVE audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r demo/requirements.txt
        continue-on-error: true

      - name: Run tests with coverage
        run: python -m pytest -q --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=75

      # B-测试：测试覆盖率产物落盘，便于下载复盘
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: demo/coverage.xml
          if-no-files-found: warn
