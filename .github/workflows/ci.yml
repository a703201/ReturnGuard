# =============================================================================
# ReturnGuard · CI（仓颉后端 + Vue3 前端 + Rust 启动器单一栈）
# 触发：push main / PR。六路并行：
#   1) 静态门禁（版本/契约/配置/红线/仓颉语法/文档/产物）
#   2) Rust 核心引擎测试
#   3) Vue 前端类型检查 + 构建 + 产物同步校验
#   4) WinUI 启动器真实构建（windows-latest + MSVC）
#   5) GTK4 启动器真实构建（ubuntu-latest + libgtk-4-dev）
#   6) CI 配置自校验（YAML 语法）
#
# 边界（诚实标注）：仓颉后端二进制需专用工具链镜像 ams-cj:1.2.0-beta.03，
# 公共 CI 不编译仓颉源码；本工作流用静态门禁覆盖其契约与配置正确性。
# 仓颉端到端验证脚本 scripts/e2e_cangjie.py 需真实服务，仅本地/自托管 runner 执行。
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-gates:
    name: 静态门禁（契约/版本/红线）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: python scripts/ci_checks.py
        run: python scripts/ci_checks.py
      - name: CI 配置语法校验
        run: |
          python -m pip install --quiet pyyaml
          python -c "import yaml, pathlib; [yaml.safe_load(pathlib.Path(f).read_text(encoding='utf-8')) for f in ['.github/workflows/ci.yml','.github/workflows/release.yml','.gitea/workflows/release.yml','.gitcode/workflows/release.yml','docker/docker-compose.cangjie.yml','docs/openapi.yaml']]; print('YAML OK')"

  version-consistency:
    name: 版本一致性（快速）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VERSION ↔ package.json ↔ launcher workspace
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$V"
          grep -q "\"version\": \"$V\"" package.json || { echo "::error::package.json 版本不一致"; exit 1; }
          grep -q "^version = \"$V\"$" launcher/Cargo.toml || { echo "::error::launcher/Cargo.toml 版本不一致"; exit 1; }
          # CHANGELOG 第 1 行是标题，版本号在首个 ## [x.y.z] 条目（与 ci_checks.py 同口径）
          grep -m1 '^## \[' CHANGELOG.md | grep -q "$V" || { echo "::error::CHANGELOG 首个版本条目未含 $V"; exit 1; }

  core-engine:
    name: Rust 核心引擎测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: CI 环境直连 crates.io（移除本地 USTC 镜像覆盖）
        run: rm -f launcher/.cargo/config.toml
      - name: cargo test -p rg-core
        working-directory: launcher
        run: cargo test -p rg-core

  frontend:
    name: Vue 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与本地构建环境一致：Node 20 与 22 下 Vite 产物哈希不同，
          # 会导致「产物已入库同步」门禁因哈希漂移而误报。
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖（lock 已入库，可重现构建）
        working-directory: web
        run: npm ci
      - name: 类型检查与构建
        working-directory: web
        run: |
          npx vue-tsc --noEmit
          npx vite build
      - name: 校验构建产物完整性
        # 不逐字节比对跨平台产物：Windows/Local 与 Ubuntu/CI 下 Vite 输出哈希
        # 必然不同（已排除 Node 版本、lock、换行符、依赖版本四个变量）。
        # 门禁目标是「源码能构建 + 构建出的产物完整可用」，不是字节级复现。
        run: |
          python - <<'PY'
          import re, pathlib, sys
          root = pathlib.Path('demo/webapp')
          entry = root / 'index.html'
          assert entry.is_file(), '缺少构建产物 index.html'
          html = entry.read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)="(/new/assets/[^"]+)"', html)
          assert len(refs) >= 2, f'入口引用资源过少: {refs}'
          for ref in refs:
              f = root / ref[len('/new/'):]
              assert f.is_file() and f.stat().st_size > 0, f'产物缺失或为空: {f}'
          print('产物完整:', ', '.join(refs))
          PY

  winui-build:
    name: WinUI 启动器真实构建
    runs-on: windows-latest
    env:
      # 只验证编译与链接，不下载 WinAppSDK Runtime（正式分发由 build-windows.ps1 执行 staging）
      RG_SKIP_WINAPP_STAGE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: CI 环境直连 crates.io（移除本地 USTC 镜像覆盖）
        shell: bash
        run: rm -f launcher/.cargo/config.toml
      - name: cargo build -p rg-win
        working-directory: launcher
        shell: bash
        run: cargo build -p rg-win
      - name: 确认 exe 产物
        shell: bash
        run: test -f launcher/target/debug/rg-win.exe && echo "rg-win.exe built"

  gtk4-build:
    name: GTK4 启动器真实构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 GTK4 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev pkg-config build-essential
          pkg-config --modversion gtk4
      - name: CI 环境直连 crates.io（移除本地 USTC 镜像覆盖）
        run: rm -f launcher/.cargo/config.toml
      - name: cargo build -p rg-gtk
        working-directory: launcher
        run: cargo build -p rg-gtk
      - name: 确认二进制产物
        run: test -f launcher/target/debug/rg-gtk && echo "rg-gtk built"
