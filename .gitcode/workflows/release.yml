# =============================================================================
# ReturnGuard · GitCode 流水线（Release，仓颉后端 + Vue3 前端 + Rust 启动器）
# 触发：推送 v* tag。行为与 GitHub / Gitea 版一致。
#
# 平台要点（GitCode / AtomGit Action）：
# 1. 工作流必须放 .gitcode/workflows/；上下文变量是 ATOMGIT_*（非 GITHUB_*）。
# 2. 检出用 checkout-action@0.0.1，代码落在 repo_workspace。
# 3. 发布需 GitCode PAT（repo/projects 写权限），secret 名 GITCODE_TOKEN。
# 4. 附件走预签名 OBS URL：先取 upload_url，再 PUT。
# =============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: repo_workspace

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_API: https://gitcode.com/api/v5
    steps:
      - name: Checkout（含全部 tag）
        uses: checkout-action@0.0.1
        with:
          fetch-depth: 0

      - name: Ensure full history & tags
        run: git fetch --unshallow --tags 2>/dev/null || git fetch --tags --quiet 2>/dev/null || true

      - name: Setup Node & jq & Rust
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            build-essential nodejs npm jq git curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          node --version && jq --version && rustc --version

      - name: Verify tag version matches VERSION
        run: |
          TAG="${ATOMGIT_REF#refs/tags/}"
          TAG_VERSION="${TAG#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG_VERSION  VERSION=$FILE_VERSION"
          test "$TAG_VERSION" = "$FILE_VERSION" || {
            echo "tag v${TAG_VERSION} 与 VERSION ${FILE_VERSION} 不一致"; exit 1; }

      - name: Test Rust launcher core
        run: |
          . "$HOME/.cargo/env"
          rm -f launcher/.cargo/config.toml   # CI 直连 crates.io
          cd launcher && cargo test -p rg-core

      - name: Determine version from tag
        id: ver
        run: |
          TAG="${ATOMGIT_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          TAG="${ATOMGIT_REF#refs/tags/}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "# ReturnGuard ${TAG#v}"
            echo
            echo "Release \`${TAG}\` — $(date +%F)"
            echo
            if [ -n "$PREV" ]; then
              echo "## Changes since \`${PREV}\`"; echo
              git log "${PREV}..${TAG}" --pretty=format:"- %s (%h)"
            else
              echo "## Changes"; echo
              git log --pretty=format:"- %s (%h)"
            fi
          } > CHANGELOG_GEN.md

      - name: Package release artifact
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          echo "$VERSION" > VERSION          # 分发包 VERSION 与 tag 一致
          mkdir -p dist
          tar -czf "dist/returnguard-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='node_modules' --exclude='__pycache__' --exclude='target' \
            --exclude='backend/build' --exclude='backend/build-linux' \
            --exclude='backend/probe' --exclude='backend/probe_db' --exclude='backend/data' \
            --exclude='web/dist' --exclude='*.db' --exclude='Dataset' --exclude='.env' \
            --exclude='*.whl' \
            backend web sdk demo docker scripts launcher \
            LICENSE NOTICE README.md CHANGELOG.md VERSION package.json \
            docs "openGauss部署指南.md"
          ( cd dist && sha256sum "returnguard-${VERSION}.tar.gz" > "returnguard-${VERSION}.sha256" )

      - name: Create GitCode Release and upload assets
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          OWNER="${ATOMGIT_REPOSITORY%%/*}"
          REPO="${ATOMGIT_REPOSITORY##*/}"

          jq -n \
            --arg tag "$TAG" \
            --arg name "ReturnGuard $VERSION" \
            --arg body "$(cat CHANGELOG_GEN.md)" \
            --arg sha "$ATOMGIT_SHA" \
            '{tag_name:$tag, name:$name, body:$body, target_commitish:$sha}' \
            > release.json

          curl -sS -X POST "$GITCODE_API/repos/$OWNER/$REPO/releases" \
            -H "Authorization: Bearer $GITCODE_TOKEN" \
            -H "Content-Type: application/json" \
            --data @release.json
          echo "Release created for $TAG."

          for f in "dist/returnguard-${VERSION}.tar.gz" "dist/returnguard-${VERSION}.sha256"; do
            fname=$(basename "$f")
            resp=$(curl -sS -H "Authorization: Bearer $GITCODE_TOKEN" \
              "$GITCODE_API/repos/$OWNER/$REPO/releases/$TAG/upload_url?file_name=$fname")
            url=$(echo "$resp" | jq -r .url)
            mapfile -t HDRS < <(echo "$resp" | jq -r '.headers | to_entries[] | "-H " + (.key) + ":" + (.value)')
            curl -sS -X PUT "$url" "${HDRS[@]}" --data-binary "@$f"
            echo " -> uploaded $fname"
          done
