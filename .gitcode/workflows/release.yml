# =============================================================================
# ReturnGuard · GitCode 流水线（Release）
# 触发：推送形如 v* 的 Git tag（如 v2.1.2）
# 行为：与 .github/workflows/release.yml、.gitea/workflows/release.yml 完全一致 ——
#   检出 → 配环境(Python+Node) → 构建(压缩前端) → 测试 → 从 tag 取版本号
#   → 生成更新日志 → 打包 tarball+sha256 → 调 GitCode API v5 创建 Release 并上传附件。
#
# 平台要点（GitCode / AtomGit Action）：
# 1. 工作流文件必须放在 .gitcode/workflows/ 目录（不是根目录 .gitcode-ci.yml），
#    否则仓库页面不会出现「流水线」入口、也不会被触发。这正是此前“看不到 CI/CD”的根因。
# 2. 语法兼容 GitHub Actions：on / jobs / runs-on / uses。
# 3. 默认资源池 runs-on: ubuntu-latest；也可用 EulerOS 的 runs-on: euleros-2.10.1。
# 4. 上下文变量是 ATOMGIT_*（不是 GITHUB_*）：
#    ATOMGIT_REF（如 refs/tags/v2.1.2）、ATOMGIT_SHA、ATOMGIT_REPOSITORY（owner/repo）。
# 5. 检出动作使用 GitCode 提供的 checkout-action@0.0.1；代码落在工作目录 repo_workspace。
#    若报找不到该动作，可改成 uses: checkout（官方快速开始示例写法）。
# 6. 发布需要 GitCode 个人访问令牌（PAT，具备 repo/projects 写权限）：
#    请在仓库「设置 → 流水线 / Secrets」新建 secret，命名为 GITCODE_TOKEN。
#    若 GitCode 后续注入内置令牌变量，把下方 $GITCODE_TOKEN 替换为该变量即可。
# =============================================================================
name: Release

on:
  push:
    tags:
      - 'v*'

# GitCode 流水线工作目录固定为 repo_workspace，checkout 后代码即落于此
defaults:
  run:
    working-directory: repo_workspace

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      GITCODE_API: https://gitcode.com/api/v5
    steps:
      - name: Checkout（含全部 tag，供生成更新日志）
        uses: checkout-action@0.0.1
        with:
          fetch-depth: 0

      - name: Ensure full history & tags
        run: git fetch --unshallow --tags 2>/dev/null || git fetch --tags --quiet 2>/dev/null || true

      - name: Setup Python & Node
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            python3-pip python3-dev build-essential nodejs npm jq git
          python3 --version && node --version && npm --version

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r demo/requirements.txt -r demo/requirements-dev.txt
          npm install

      - name: Build（压缩前端静态资源）
        run: node scripts/minify.mjs

      - name: Test
        run: pytest demo/tests -p no:cacheprovider -q

      - name: Determine version from tag
        id: ver
        run: |
          TAG="${ATOMGIT_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          TAG="${ATOMGIT_REF#refs/tags/}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          {
            echo "# ReturnGuard ${TAG#v}"
            echo
            echo "Release \`${TAG}\` — $(date +%F)"
            echo
            if [ -n "$PREV" ]; then
              echo "## Changes since \`${PREV}\`"
              echo
              git log "${PREV}..${TAG}" --pretty=format:"- %s (%h)"
            else
              echo "## Changes"
              echo
              git log --pretty=format:"- %s (%h)"
            fi
          } > CHANGELOG_GEN.md

      - name: Package release artifact
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          echo "$VERSION" > VERSION          # 让分发包的 VERSION 与 tag 一致
          mkdir -p dist
          tar -czf "dist/returnguard-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='docker/wheels/*.whl' --exclude='*.whl' \
            --exclude='node_modules' --exclude='__pycache__' \
            --exclude='*.db' --exclude='Dataset' --exclude='.env' \
            demo docker scripts LICENSE NOTICE README.md CHANGELOG.md \
            VERSION package.json pyproject.toml docs "openGauss部署指南.md"
          ( cd dist && sha256sum "returnguard-${VERSION}.tar.gz" > "returnguard-${VERSION}.sha256" )

      - name: Create GitCode Release and upload assets
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          OWNER="${ATOMGIT_REPOSITORY%%/*}"
          REPO="${ATOMGIT_REPOSITORY##*/}"

          # 1) 创建 Release（用 jq 安全转义多行 changelog）
          jq -n \
            --arg tag "$TAG" \
            --arg name "ReturnGuard $VERSION" \
            --arg body "$(cat CHANGELOG_GEN.md)" \
            --arg sha "$ATOMGIT_SHA" \
            '{tag_name:$tag, name:$name, body:$body, target_commitish:$sha}' \
            > release.json

          curl -sS -X POST "$GITCODE_API/repos/$OWNER/$REPO/releases" \
            -H "Authorization: Bearer $GITCODE_TOKEN" \
            -H "Content-Type: application/json" \
            --data @release.json
          echo "Release created for $TAG."

          # 2) 逐个上传附件（GitCode 用预签名 OBS URL：先取上传地址，再 PUT）
          for f in "dist/returnguard-${VERSION}.tar.gz" "dist/returnguard-${VERSION}.sha256"; do
            fname=$(basename "$f")
            resp=$(curl -sS -H "Authorization: Bearer $GITCODE_TOKEN" \
              "$GITCODE_API/repos/$OWNER/$REPO/releases/$TAG/upload_url?file_name=$fname")
            url=$(echo "$resp" | jq -r .url)
            mapfile -t HDRS < <(echo "$resp" | jq -r '.headers | to_entries[] | "-H " + (.key) + ":" + (.value)')
            curl -sS -X PUT "$url" "${HDRS[@]}" --data-binary "@$f"
            echo " -> uploaded $fname"
          done
